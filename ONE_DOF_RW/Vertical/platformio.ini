[platformio]
default_envs = sensors
; Short dependency path avoids Windows MAX_PATH failures in upstream examples.
libdeps_dir = ${sysenv.USERPROFILE}/.platformio/libdeps-vertical

[env]
platform = espressif32@8.0.0
board = esp32doit-devkit-v1
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@4.30312.261016
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 115200
upload_port = COM10
monitor_port = COM10
build_flags = -Wall -Wextra
; Update both ports if Windows assigns a different ESP32 USB COM port.
; Never select a Bluetooth COM port for this project.

[env:sensors]
build_src_filter = +<main.cpp>

[env:motor_test]
build_src_filter = +<main.cpp> +<motor_test.cpp>
build_src_flags = -DENABLE_WHEEL_COMMANDS
lib_deps = https://github.com/simplefoc/Arduino-FOC.git#v2.4.0
