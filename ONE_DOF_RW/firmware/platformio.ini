[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_eol = LF
; Reduced after an interrupted flash transfer; serial monitor remains 115200.
upload_speed = 57600
; Bypass the RAM flasher after it stopped responding; use the ESP32 ROM loader.
upload_flags =
    --no-stub
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.6

; Generic ESP32/WROOM target. Confirm the board before uploading.
; Ports are detected automatically. Uncomment if multiple devices are connected.
; upload_port = COM10
; monitor_port = COM10
